name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syncscore
          POSTGRES_PASSWORD: syncscore_local_only
          POSTGRES_DB: syncscore
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U syncscore" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://syncscore:syncscore_local_only@localhost:54329/syncscore
      DIRECT_URL: postgresql://syncscore:syncscore_local_only@localhost:54329/syncscore
      STUDENT_EMAIL_DOMAINS: g.bracu.ac.bd
      FACULTY_EMAIL_DOMAINS: bracu.ac.bd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          PGPASSWORD=syncscore_local_only psql -h localhost -p 54329 -U syncscore -d syncscore -c "CREATE DATABASE syncscore_test" -c "CREATE DATABASE syncscore_e2e"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - run: pnpm build
        env:
          AUTH_SECRET: ci-build-only-secret-0123456789abcdef
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
